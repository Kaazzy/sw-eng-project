name: .NET CI

on:
  push:
    branches: [ main, master, develop, feature/** ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.x SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
          cache: true

      - name: Restore
        run: dotnet restore "sw_project/sw_project.sln"

      - name: Build (Release)
        run: dotnet build "sw_project/sw_project.sln" --configuration Release --no-restore

      - name: Test (if any test projects exist)
        shell: bash
        run: |
          if dotnet sln "sw_project/sw_project.sln" list | grep -i test; then
            dotnet test "sw_project/sw_project.sln" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
          else
            echo "No test projects found. Skipping dotnet test."
          fi

      - name: Upload test results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore
