name: CI/CD (Azure Web App)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  WEBAPP_PROJECT_PATH: "sw_project/sw_project/sw_project.csproj"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WEBAPP_PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.WEBAPP_PROJECT_PATH }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.WEBAPP_PROJECT_PATH }}" --configuration Release --no-build --verbosity normal

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.WEBAPP_PROJECT_PATH }}" --configuration Release --output publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: swproject20251220211950
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
